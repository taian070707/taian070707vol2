<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>やさしい投資ナビAI - 第2弾</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#fbfaf6;color:#292524;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
.card{background:#ffffff;border:1px solid #ece8df;box-shadow:0 6px 18px -4px rgba(41,37,36,.05)}
.yf-head{background:linear-gradient(180deg,#1e293b,#334155);color:#fff}
.gauge{background:linear-gradient(90deg,#10b981 0%,#38bdf8 35%,#fbbf24 70%,#f43f5e 100%)}
.sc::-webkit-scrollbar{width:4px;height:4px}.sc::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:99px}
.hidden{display:none!important}
@keyframes sp{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:sp .8s linear infinite}
</style>
</head>
<body class="max-w-md mx-auto min-h-screen px-3.5 pt-3">

<!-- 1. ヘッダー -->
<header class="flex justify-between items-center mb-3">
  <div>
    <div class="flex items-center gap-1.5 mb-0.5">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="syncTxt" class="text-[10px] font-bold text-emerald-700">統計AIが市場データをやさしく翻訳中</span>
    </div>
    <h1 class="text-lg font-extrabold text-stone-800 tracking-tight">やさしい投資ナビ <span class="text-[11px] bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full">第2弾</span></h1>
  </div>
  <div class="flex gap-1.5">
    <button type="button" onclick="syncAll()" class="text-[11px] font-extrabold text-white bg-emerald-600 hover:bg-emerald-700 px-2.5 py-2 rounded-2xl shadow-sm flex items-center gap-1"><span id="syncIco">🔄</span>最新にする</button>
    <button type="button" onclick="modal('catModal',1)" class="text-[11px] font-bold text-stone-700 bg-white border border-stone-200 px-2.5 py-2 rounded-2xl">📖 図鑑</button>
  </div>
</header>

<!-- 2. 検索バー（株・投資信託・4桁/8桁コード完全対応） -->
<section class="mb-3.5">
  <div class="card rounded-3xl p-3 border-2 border-emerald-500/30">
    <div class="flex items-center gap-1.5">
      <span class="text-base">🔍</span>
      <input type="search" id="qIn" placeholder="気になる会社名・投資信託・コードを入力..." autocomplete="off" class="w-full text-xs font-bold bg-stone-50 border border-stone-200 rounded-2xl px-3 py-2 focus:outline-none">
      <button type="button" id="clrBtn" onclick="clrSearch()" class="hidden text-stone-400 px-2 py-1.5 text-xs font-bold bg-stone-100 rounded-xl">✕</button>
      <button type="button" onclick="directSearch()" class="bg-emerald-600 text-white text-xs font-extrabold px-3 py-2 rounded-2xl shrink-0">探す</button>
    </div>
    <div class="flex items-center gap-1.5 mt-2 pt-2 border-t border-stone-100 overflow-x-auto sc pb-1">
      <span class="text-[10px] font-bold text-stone-400 shrink-0">人気の検索:</span>
      <button type="button" onclick="qSet('日経225')" class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-xl border border-emerald-200 shrink-0">🌱 日経225投信</button>
      <button type="button" onclick="qSet('netWIN')" class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-xl border border-emerald-200 shrink-0">🌱 netWIN</button>
      <button type="button" onclick="qSet('千葉')" class="text-[10px] font-bold bg-amber-50 text-amber-900 px-2.5 py-1 rounded-xl border border-amber-200 shrink-0">🏦 千葉銀行</button>
      <button type="button" onclick="qSet('りそな')" class="text-[10px] font-bold bg-amber-50 text-amber-900 px-2.5 py-1 rounded-xl border border-amber-200 shrink-0">🏦 りそなHD</button>
      <button type="button" onclick="qSet('北浜')" class="text-[10px] font-bold bg-sky-50 text-sky-800 px-2.5 py-1 rounded-xl border border-sky-200 shrink-0">📈 北浜キャピタル</button>
      <button type="button" onclick="qSet('キオクシア')" class="text-[10px] font-bold bg-purple-50 text-purple-800 px-2.5 py-1 rounded-xl border border-purple-200 shrink-0">💎 キオクシア</button>
    </div>
    <div id="sPanel" class="hidden mt-2.5 pt-2 border-t border-emerald-100">
      <div class="flex justify-between items-center mb-1.5 px-1">
        <span class="text-[11px] font-extrabold text-emerald-800">見つかった候補（タップで追加・診断）</span>
        <button type="button" onclick="clrSearch()" class="text-[10px] font-bold text-stone-400 bg-stone-100 px-2 py-0.5 rounded-lg">▲ 閉じる</button>
      </div>
      <div id="sList" class="max-h-60 overflow-y-auto divide-y divide-stone-100 border border-stone-200 rounded-2xl bg-white sc"></div>
      <div id="sMsg" class="hidden mt-1.5 px-2.5 py-1 bg-emerald-50 rounded-xl text-[10px] font-bold text-emerald-800"></div>
    </div>
  </div>
</section>

<!-- 3. 失敗しない「3つの袋」予算シミュレーター -->
<section class="card rounded-3xl p-4 mb-3.5 bg-gradient-to-br from-white to-amber-50/40">
  <div class="flex justify-between items-center mb-1.5">
    <h2 class="text-xs font-extrabold text-stone-700">👛 失敗しない「3つの袋」予算わけ</h2>
    <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">一度に全部買わない安心設計</span>
  </div>
  <p class="text-[11px] text-stone-500 mb-2.5 leading-relaxed">お金を3つの袋に分けておくと、買ったあとに値下がりしても「安く買い足せるチャンス」に変わります。</p>
  <div class="grid grid-cols-2 gap-2 mb-2.5">
    <div class="bg-stone-50 p-2 rounded-2xl border border-stone-200/80">
      <label class="text-[10px] font-bold text-stone-500 block">使えるご予算 (円)</label>
      <input type="number" id="bIn" value="300000" step="10000" class="w-full bg-white border border-stone-200 rounded-xl px-2 py-1 text-xs font-extrabold" oninput="renderAll()">
    </div>
    <div class="bg-stone-50 p-2 rounded-2xl border border-stone-200/80">
      <label class="text-[10px] font-bold text-stone-500 block">いまの世の中の空気</label>
      <select id="mSel" class="w-full bg-white border border-stone-200 rounded-xl px-1.5 py-1 text-xs font-bold" onchange="renderAll()">
        <option value="rate_hike">🏦 金利が上がる時期（銀行に追い風）</option>
        <option value="normal">☀️ ふつうの穏やかな時期</option>
        <option value="shock">☔ 市場全体が急に下がった時期</option>
        <option value="overheat">🔥 みんなが買い急いでいる時期</option>
      </select>
    </div>
  </div>
  <div id="allocBox" class="grid grid-cols-3 gap-2 text-center"></div>
</section>

<!-- 4. フィルター & 並び替え -->
<div class="flex items-center justify-between gap-2 mb-2.5">
  <div class="flex gap-1 overflow-x-auto sc">
    <button type="button" onclick="setFlt('ALL')" id="f-ALL" class="text-[11px] font-bold px-3 py-1.5 rounded-2xl bg-emerald-600 text-white">すべて</button>
    <button type="button" onclick="setFlt('STOCK')" id="f-STOCK" class="text-[11px] font-bold px-3 py-1.5 rounded-2xl bg-white border text-stone-600">🏢 会社の株</button>
    <button type="button" onclick="setFlt('FUND')" id="f-FUND" class="text-[11px] font-bold px-3 py-1.5 rounded-2xl bg-white border text-stone-600">🌱 投資信託</button>
    <button type="button" onclick="setFlt('REIT')" id="f-REIT" class="text-[11px] font-bold px-3 py-1.5 rounded-2xl bg-white border text-stone-600">🏙️ 不動産</button>
  </div>
  <select id="sSel" onchange="renderList()" class="text-[11px] font-bold bg-white border rounded-2xl px-2.5 py-1.5 text-stone-700">
    <option value="def">追加した順</option>
    <option value="score">おすすめ順</option>
    <option value="rsi">お買い得順</option>
  </select>
</div>

<!-- 5. 監視リスト -->
<section>
  <div class="flex justify-between items-center mb-2 px-1">
    <span class="text-[11px] font-bold text-stone-500">💡 カードをタップすると「チャートとやさしい理由」を表示</span>
    <span id="cntLbl" class="text-[11px] font-extrabold text-emerald-700"></span>
  </div>
  <div id="wBox" class="space-y-3"></div>
  <div class="mt-5 flex justify-center gap-4">
    <button type="button" onclick="modal('custModal',1)" class="text-[11px] font-bold text-emerald-700 underline">＋ コード指定・手動で追加</button>
    <button type="button" onclick="resetAll()" class="text-[11px] text-stone-400 underline">最初のリストに戻す</button>
  </div>
</section>

<!-- 詳細モーダル（最上部：株価・PTS・チャート ＋ 中段：数字を使わないやさしい解説 ＋ 下段：統計根拠データ） -->
<div id="dtModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
  <div class="bg-[#fbfaf6] w-full max-w-md rounded-t-3xl sm:rounded-3xl border shadow-2xl max-h-[94vh] flex flex-col overflow-hidden">
    <div class="bg-[#1e293b] text-white px-4 py-3 flex justify-between items-center shrink-0">
      <div class="min-w-0 pr-2">
        <div class="flex items-center gap-1.5"><span id="mBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded-md"></span><span id="mCode" class="text-[11px] font-bold text-slate-300"></span></div>
        <h3 id="mTitle" class="text-sm font-extrabold text-white mt-0.5 truncate"></h3>
      </div>
      <button type="button" onclick="modal('dtModal',0)" class="w-8 h-8 rounded-full bg-slate-700 text-white font-bold">✕</button>
    </div>
    <div id="mBody" class="p-3.5 overflow-y-auto space-y-3.5 sc"></div>
    <div class="bg-white px-4 py-2.5 border-t flex gap-2 shrink-0">
      <button type="button" id="mDel" class="px-3 py-2 rounded-2xl border border-rose-200 bg-rose-50 text-rose-600 text-xs font-bold">🗑️ 外す</button>
      <button type="button" id="mSync" class="px-3 py-2 rounded-2xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs font-extrabold">🔄 最新価格を再取得</button>
      <button type="button" onclick="modal('dtModal',0)" class="flex-1 py-2 rounded-2xl bg-emerald-600 text-white text-xs font-extrabold">閉じる</button>
    </div>
  </div>
</div>

<!-- 図鑑モーダル -->
<div id="catModal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
  <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl border shadow-2xl max-h-[88vh] flex flex-col overflow-hidden">
    <div class="px-4 py-3 border-b flex justify-between items-center">
      <h3 class="text-sm font-extrabold">📖 人気の株・投資信託 図鑑</h3>
      <button type="button" onclick="modal('catModal',0)" class="w-7 h-7 rounded-full bg-stone-100 font-bold">✕</button>
    </div>
    <div class="p-2.5 bg-stone-50 border-b">
      <input type="search" id="catIn" placeholder="図鑑内を検索（例: 日経225, netWIN, 千葉, 銀行）" class="w-full bg-white border rounded-2xl px-3 py-1.5 text-xs font-bold" oninput="renderCat()">
    </div>
    <div id="catList" class="p-3 overflow-y-auto divide-y flex-1 sc"></div>
  </div>
</div>

<!-- コード・手動追加モーダル -->
<div id="custModal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-3xl p-5 border shadow-2xl space-y-3">
    <div class="flex justify-between items-center">
      <h3 class="text-sm font-extrabold">📝 コード指定・手動追加</h3>
      <button type="button" onclick="modal('custModal',0)" class="w-7 h-7 rounded-full bg-stone-100 font-bold">✕</button>
    </div>
    <p class="text-[11px] text-stone-500">株の4桁コード(例: <code>8331</code>)や投資信託の8桁コード(例: <code>47311988</code>, <code>AJ313178</code>)を入れると自動で価格とチャートを取得します。</p>
    <div class="space-y-2 text-xs">
      <input type="text" id="cCode" placeholder="コード（例: 47311988 / AJ313178 / 8331）" class="w-full bg-stone-50 border rounded-2xl px-3 py-2 font-bold">
      <input type="text" id="cName" placeholder="名前（空欄でもコードから自動取得します）" class="w-full bg-stone-50 border rounded-2xl px-3 py-2 font-bold">
      <div class="grid grid-cols-2 gap-2">
        <select id="cType" class="bg-stone-50 border rounded-2xl px-2 py-2 font-bold">
          <option value="FUND">🌱 投資信託</option>
          <option value="STOCK">🏢 会社の株</option>
          <option value="LEVERAGE">⚡ ブル型投信</option>
          <option value="REIT">🏙️ 不動産(REIT)</option>
        </select>
        <input type="number" step="0.1" id="cPrice" placeholder="現在価格(空欄で自動)" class="bg-stone-50 border rounded-2xl px-3 py-2 font-bold">
      </div>
    </div>
    <div class="flex gap-2 pt-1">
      <button type="button" onclick="modal('custModal',0)" class="flex-1 py-2 rounded-2xl bg-stone-100 text-xs font-bold">キャンセル</button>
      <button type="button" onclick="submitCust()" class="flex-1 py-2 rounded-2xl bg-emerald-600 text-white text-xs font-extrabold">取得して追加</button>
    </div>
  </div>
</div>
